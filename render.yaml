services:
  - type: web
    name: ecommerce-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/live
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 'true'
      - key: SWAGGER_ENABLED
        value: 'true'

      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: TWO_FACTOR_TOKEN_SECRET
        generateValue: true
      - key: TWO_FACTOR_TOKEN_EXPIRES_IN
        value: 5m
      - key: VERIFICATION_CODE_SECRET
        generateValue: true
      - key: API_SECRET_KEY
        generateValue: true

      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONENUMBER
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: ecommerce-media

      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      # Browser redirects after PayOS. Configure these with the deployed
      # storefront URL, e.g. https://shop.example.com/payment/success.
      - key: PAYOS_RETURN_URL
        sync: false
      - key: PAYOS_CANCEL_URL
        sync: false

      # Comma-separated exact frontend origins are supported, e.g.
      # https://shop.example.com,http://localhost:5173
      - key: CORS_ORIGIN
        sync: false
      - key: SENTRY_ENABLED
        value: 'false'
