name: ecommerce-e2e

services:
  postgres-e2e:
    image: postgres:17-alpine
    container_name: ecommerce-e2e-postgres
    environment:
      POSTGRES_DB: ecommerce_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ecommerce_e2e']
      interval: 2s
      timeout: 3s
      retries: 20

  redis-e2e:
    image: redis:7-alpine
    container_name: ecommerce-e2e-redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
